name: daily-ingest

on:
  schedule:
    # 09:17 UTC = 02:17 America/Phoenix. Off the hour on purpose: everything
    # scheduled at :00 competes for the same runner capacity.
    - cron: "17 9 * * *"
  workflow_dispatch:
    inputs:
      lookback_days:
        description: "Days to look back if no watermark exists yet"
        required: false
        default: "2"

concurrency:
  group: daily-ingest
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
      CTP_LOOKBACK_DAYS: ${{ github.event.inputs.lookback_days || '2' }}
      CTP_REQUESTS_PER_MINUTE: "40"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Verify the API contract
        run: python -m ctp verify-api

      - name: Run the daily Prefect flow
        run: python -m ctp.flows

      - name: Regenerate the status page
        if: always()
        run: python -m ctp status

      - name: Commit the status page
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/index.html
          if git diff --staged --quiet; then
            echo "status page unchanged"
          else
            git commit -m "status: run $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
